<text x="83" y="409" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="23" font-weight="700">なぜ、Caliboo をつくるのか。</text>
<text x="760" y="406" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="14" font-weight="700" text-anchor="end">開発者・竹内の思い</text>
<text x="83" y="441" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="17" font-weight="400">年間20〜25人の新人を、講師1人が担当する3か月研修。</text>
<text x="83" y="469" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="17" font-weight="700">新人研修は、一人ひとりの強みを発掘し、伸ばす場であってほしい。</text>
<text x="83" y="497" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="17" font-weight="400">自由な発想が許された3か月を、課題の期日に追われて終えるのは、</text><text x="83" y="524" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="17" font-weight="400">心の底からもったいないと思います。</text>
<text x="83" y="553" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="16" font-weight="400">客先での生成AI活用やモニタリングシステムでの可視化で培ったノウハウを生かし、</text>
<text x="83" y="577" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="17" font-weight="700">私自身が推進し、実現していきます。</text>
<text x="60" y="637" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="27" font-weight="700">一行の日報から、何が見える？</text>
<rect x="460" y="613" width="82" height="30" rx="14" fill="#EEF8F4" stroke="#9ADBC9" stroke-width="1.4"/>
<text x="501" y="634" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="14" font-weight="700" text-anchor="middle">日報の例</text>
<rect x="60" y="660" width="720" height="147" rx="15" fill="#EEF8F4" stroke="#9ADBC9" stroke-width="1.4"/>
<text x="84" y="690" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="15" font-weight="700">例えば、新人がこう書いたら</text>
<text x="84" y="734" fill="#214F49" font-family="'Noto Serif CJK JP','Yu Mincho',serif" font-size="25" font-weight="700">「初めて使う人が迷ったので、</text><text x="84" y="776" fill="#214F49" font-family="'Noto Serif CJK JP','Yu Mincho',serif" font-size="25" font-weight="700">手順の順番を変えました。」</text>
<rect x="60" y="848" width="35" height="35" rx="18" fill="#9ADBC9"/>
<text x="77.5" y="872" fill="#214F49" font-family="'DejaVu Sans',Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">1</text>
<text x="115" y="856" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="20" font-weight="700">AIによる</text><text x="115" y="884" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="20" font-weight="700">強み解析と創出</text>
<text x="300" y="855" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="16.5" font-weight="400">「相手の立場で作業を整理できる」と強みの候補を創出。</text><text x="300" y="882" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="16.5" font-weight="400">日報のどの記述を根拠にしたかも示します。</text>
<path d="M60 914L780 914" fill="none" stroke="#CBE4DA" stroke-width="1.25"/>
<rect x="60" y="952" width="35" height="35" rx="18" fill="#F5A9B8"/>
<text x="77.5" y="976" fill="#214F49" font-family="'DejaVu Sans',Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">2</text>
<text x="115" y="958" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="20" font-weight="700">新入社員への</text><text x="115" y="986" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="20" font-weight="700">フィードバック</text>
<text x="300" y="952" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="16.2" font-weight="400">本人は強みのフィードバックから次に試す行動を選びます。</text><text x="300" y="979" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="16.2" font-weight="400">「金曜までに、初めての人に使ってもらおう」。</text><text x="300" y="1006" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="16.2" font-weight="400">説明なしで最後まで進めたか、次の日報に残します。</text>
<path d="M60 1035L780 1035" fill="none" stroke="#CBE4DA" stroke-width="1.25"/>
<text x="63" y="1067" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="14" font-weight="400">※ 現行の試作では講師が候補と原文を確認し、承認済みの強みを本人に表示します。</text>
<path d="M60 1139L780 1139" fill="none" stroke="#9ADBC9" stroke-width="1.4"/>

<text x="780" y="1163" fill="#214F49" font-family="'DejaVu Sans',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="end">01 / 02</text>

<text x="60" y="206" fill="#214F49" font-family="'Noto Serif CJK JP','Yu Mincho',serif" font-size="37" font-weight="700">まずは、自分でPoCを進める。</text>
<text x="60" y="240" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="16" font-weight="400">自分の権限の範囲で実証検証。候補が指導に使えるか、講師が無理なく確認できるかを確かめます。</text><text x="60" y="268" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="16" font-weight="400">その結果を踏まえて、研修への展開を検討します。</text>

<text x="145" y="346" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="22" font-weight="700">利用が許可された日報・AIでPoCを始める</text>

<text x="145" y="418" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="22" font-weight="700">竹内が日報20件を目標に検証する</text>

<text x="145" y="490" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="22" font-weight="700">展開する際に、関係部署・情シスへ相談する</text>

<text x="77" y="575" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="15" font-weight="700">試作で確認できたこと</text>
<text x="77" y="612" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="23" font-weight="700">1人・3日で試作</text>
<text x="77" y="644" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="15" font-weight="400">AIが書いた作業記録を使い、講師役もAIとして、</text><text x="77" y="669" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="15" font-weight="400">課題配信から承認後の強み表示まで動作を</text><text x="77" y="694" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="15" font-weight="400">確認しました。</text>
<text x="77" y="732" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="14" font-weight="400">「3か月で新入社員を戦力化する」は目標。</text><text x="77" y="756" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="14" font-weight="400">実日報での妥当性・教育効果は未検証です。</text>
<text x="444" y="575" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="14" font-weight="700">研修試行時の仮見積もり｜解析APIのみ</text>
<text x="444" y="612" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="23" font-weight="700">3か月 約3.4万〜4.3万円</text>
<text x="444" y="644" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="15" font-weight="400">20〜25人 × 1日1回 × 月20日 × 3か月。</text><text x="444" y="669" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="15" font-weight="400">解析1回あたり28.7円（約29円）と仮定した</text><text x="444" y="694" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="15" font-weight="400">試算です。</text>
<text x="444" y="732" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="14" font-weight="400">講師の確認・修正、運用・保守は別。</text><text x="444" y="756" fill="#214F49" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="14" font-weight="400">実API接続と費用は未検証です。</text>
