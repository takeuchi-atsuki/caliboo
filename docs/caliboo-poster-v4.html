<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Caliboo｜研修の途中で、強みを見つける。</title><style>@page{size:A4;margin:0}*{box-sizing:border-box}body{background:#E7F5EF;margin:0}main{max-width:210mm;margin:auto}main>svg{width:100%;height:auto;display:block}@media print{html,body,main,main>svg{width:210mm;height:297mm;margin:0}}</style></head><body><main><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="210mm" height="297mm" viewBox="0 0 840 1188" role="img" aria-labelledby="title desc"><title id="title">Caliboo｜研修の途中で、強みを見つける。</title><desc id="desc">Caliboo は、あなただからできることを見つけ、ミライへ飛び続けるための翼となることを約束します。AIによる強み解析と創出、新入社員へのフィードバックを行うキャリブレーション型教育ツール。現行試作では講師が確認・承認した強みを表示する。3か月で新入社員を戦力化することを目標に、自分で進める実証検証と、社内展開を検討する際には相談先について協議する方針を示したポスター。</desc>
