" y="516" font-family="Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" fill="#42765f">→</text><text x="239" y="516" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#42765f">02</text><text x="264" y="516" font-family="Noto Sans CJK JP,sans-serif" font-size="16" font-weight="700" fill="#203f36">強みを探す</text><text x="372" y="516" font-family="Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" fill="#42765f">→</text><text x="406" y="516" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#42765f">03</text><text x="431" y="516" font-family="Noto Sans CJK JP,sans-serif" font-size="16" font-weight="700" fill="#203f36">行動する</text><text x="539" y="516" font-family="Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" fill="#42765f">→</text><text x="573" y="516" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#42765f">04</text><text x="598" y="516" font-family="Noto Sans CJK JP,sans-serif" font-size="16" font-weight="700" fill="#203f36">振り返る</text><text x="72" y="552" font-family="Noto Sans CJK JP,sans-serif" font-size="15" font-weight="400" fill="#203f36">日報や課題からアプリが強みの候補を示し、講師が根拠を確認して承認します。</text><text x="72" y="577" font-family="Noto Sans CJK JP,sans-serif" font-size="15" font-weight="400" fill="#203f36">本人が次に試すことを決め、実践した結果を振り返ります。</text><text x="48" y="635" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="700" fill="#42765f">TOOLKIT</text><text x="48" y="672" font-family="Noto Sans CJK JP,sans-serif" font-size="26" font-weight="700" fill="#203f36">毎日の研修を支える、4つの機能</text><rect x="48" y="692" width="335" height="1" rx="0" fill="#b7c8b8"/><text x="48" y="724" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#42765f">01</text><text x="80" y="724" font-family="Noto Sans CJK JP,sans-serif" font-size="20" font-weight="700" fill="#203f36">日報・振り返り</text><text x="48" y="753" font-family="Noto Sans CJK JP,sans-serif" font-size="15" font-weight="400" fill="#203f36">続けたいこと、困ったこと、次に試すこと</text><text x="48" y="776" font-family="Noto Sans CJK JP,sans-serif" font-size="15" font-weight="400" fill="#203f36">（KPT）を、その日の気持ちと一緒に記録。</text><rect x="411" y="692" width="335" height="1" rx="0" fill="#b7c8b8"/><text x="411" y="724" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#42765f">02</text><text x="443" y="724" font-family="Noto Sans CJK JP,sans-serif" font-size="20" font-weight="700" fill="#203f36">OJT相談</text><text x="411" y="753" font-family="Noto Sans CJK JP,sans-serif" font-size="15" font-weight="400" fill="#203f36">部署の資料をもとに疑問を解消。</text><text x="411" y="776" font-family="Noto Sans CJK JP,sans-serif" font-size="15" font-weight="400" fill="#203f36">講師に相談を依頼することもできます。</text><rect x="48" y="796" width="335" height="1" rx="0" fill="#b7c8b8"/><text x="48" y="828" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#42765f">03</text><text x="80" y="828" font-family="Noto Sans CJK JP,sans-serif" font-size="20" font-weight="700" fill="#203f36">資格勉強・課題</text><text x="48" y="857" font-family="Noto Sans CJK JP,sans-serif" font-size="15" font-weight="400" fill="#203f36">クイズと解説で理解を深め、</text><text x="48" y="880" font-family="Noto Sans CJK JP,sans-serif" font-size="15" font-weight="400" fill="#203f36">学んだ知識を課題演習で試します。</text><rect x="411" y="796" width="335" height="1" rx="0" fill="#b7c8b8"/><text x="411" y="828" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#42765f">04</text><text x="443" y="828" font-family="Noto Sans CJK JP,sans-serif" font-size="20" font-weight="700" fill="#203f36">強み・次の一歩</text><text x="411" y="857" font-family="Noto Sans CJK JP,sans-serif" font-size="15" font-weight="400" fill="#203f36">強みの根拠と育成のヒントを参考に、</text><text x="411" y="880" font-family="Noto Sans CJK JP,sans-serif" font-size="15" font-weight="400" fill="#203f36">本人が目標と期限を決めます。</text><rect x="48" y="916" width="698" height="130" rx="17" fill="#224d40"/
