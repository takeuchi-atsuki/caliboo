name: Caliboo quality gates

# Initial rollout: only reviewed code on these same-repository validation branches.
on:
  push:
    branches:
      - ci/verify-32-base
      - ci/verify-32-postgresql
      - ci/verify-32-package
      - ci/verify-32-assignment
      - ci/verify-32-gui
      - ci/verify-32-all

permissions:
  contents: read

env:
  PIP_NO_CACHE_DIR: '1'
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  CALIBOO_AI_PROVIDER: manual
  CALIBOO_COOKIE_SECURE: 'false'

jobs:
  quality:
    if: github.repository == 'takeuchi-atsuki/caliboo' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Install dependencies
        run: |
          python -m pip install -e './backend[dev]'
          npm ci --prefix frontend
      - name: Gate script lint and self-tests
        run: |
          python -m flake8 --isolated --max-line-length=100 devel/ci
          python -m unittest discover -s devel/ci -p 'test_quality_gate.py'
      - name: Backend lint, unit and integration (no network)
        run: python devel/ci/quality_gate.py backend
      - name: Frontend type check, coverage and both build entries
        run: python devel/ci/quality_gate.py frontend
      - name: Install pinned Chromium
        run: |
          python -m pip install -r devel/ci/browser-requirements.txt
          python -m playwright install --with-deps chromium
      - name: SQLite browser and restart smoke
        shell: bash
        run: |
          args=()
          case "$GITHUB_REF_NAME" in
            ci/verify-32-assignment) args+=(--assignment) ;;
            ci/verify-32-gui) args+=(--gui) ;;
            ci/verify-32-all) args+=(--assignment --gui) ;;
            ci/verify-32-base|ci/verify-32-postgresql|ci/verify-32-package) ;;
            *) exit 1 ;;
          esac
          python devel/ci/browser_e2e.py "${args[@]}"

  postgresql:
    # Branch selection is explicit: a candidate that should contain #25 must fail
    # if its real PostgreSQL tests or migration scripts are missing.
    if: >-
      github.repository == 'takeuchi-atsuki/caliboo' && github.event_name == 'push' &&
      (github.ref_name == 'ci/verify-32-postgresql' || github.ref_name == 'ci/verify-32-all')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: caliboo-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install backend development dependencies
        run: python -m pip install -e './backend[dev]'
      - name: PostgreSQL 18 initialization, migration, concurrent use and recovery
        env:
          CALIBOO_CI_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          CALIBOO_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          CALIBOO_CI_POSTGRES_PASSWORD: caliboo-ci-only
        run: python devel/ci/postgres_gate.py

  package:
    if: >-
      github.repository == 'takeuchi-atsuki/caliboo' && github.event_name == 'push' &&
      (github.ref_name == 'ci/verify-32-package' || github.ref_name == 'ci/verify-32-all')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Install pinned Chromium
        run: |
          python -m pip install -r devel/ci/browser-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Clean release ZIP smoke
        run: python devel/ci/package_gate.py
