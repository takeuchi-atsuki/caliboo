[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caliboo-api"
version = "0.1.0"
description = "Caliboo 学習支援アプリのバックエンドAPI(FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.4",
    "pytest-cov>=7.1",
    "pytest-socket>=0.8",
    "flake8>=7.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
# テストが実ネットワークへ出ないことを既定で担保する。
# --allow-unix-socket を併用するのは、FastAPIのTestClientが内部のイベントループ起動に
# socketpair(AF_UNIX)を使うため。これを塞ぐとTestClientを使うテストが全て起動できなくなる。
addopts = "--disable-socket --allow-unix-socket"

[tool.coverage.run]
source = ["caliboo_api"]
# 分岐カバレッジも計測する。行カバレッジだけだと、条件式の片側しか通っていない
# 判定ロジック(解析エンジンのしきい値分岐等)が100%と表示されてしまうため。
branch = true
